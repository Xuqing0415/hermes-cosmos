# GitHub Actions CI/CD for Hermes

name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        pip install -r requirements.txt
        pip install z3-solver requests structlog
    
    - name: Show Python version
      run: |
        python --version
        pip --version
    
    - name: List files
      run: |
        ls -la src/hermes/
        ls -la tests/
    
    - name: Run single test
      run: |
        python -m pytest tests/test_self_rebirth.py::TestSelfAuditor::test_init -v --tb=short