# GitHub Actions CI/CD for Hermes
# 完整 CI/CD 管线：linting → 测试（含覆盖率） → Docker 构建

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # Job 1: 代码质量检查（Linting）
  # ============================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Determine changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          FILES=$(git diff --name-only "$BASE"...HEAD -- '*.py' || true)
          echo "changed=$(echo "$FILES" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "Changed Python files:"
          echo "$FILES"

      - name: Check formatting (black)
        run: |
          FILES="${{ steps.changed.outputs.changed }}"
          if [ -n "$FILES" ]; then black --check --diff $FILES; fi

      - name: Check imports (isort)
        run: |
          FILES="${{ steps.changed.outputs.changed }}"
          if [ -n "$FILES" ]; then isort --check-only --diff $FILES; fi

      - name: Lint (flake8)
        run: |
          FILES="${{ steps.changed.outputs.changed }}"
          if [ -n "$FILES" ]; then flake8 $FILES --max-line-length=120 --extend-ignore=E203,W503; fi

  # ============================================================
  # Job 2: 单元测试（含覆盖率）
  # ============================================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: []  # 与 lint 并行运行，不阻塞
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests with coverage
        run: |
          PYTHONPATH=src python -m pytest tests/ \
            --cov=hermes \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=0 \
            -v --tb=short

      - name: Upload coverage to Codecov (optional)
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================================
  # Job 3: Docker 镜像构建验证（仅 main 分支 push）
  # ============================================================
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (verify only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max