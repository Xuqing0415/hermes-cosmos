# GitHub Actions CI/CD for Hermes

name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest jinja2 structlog requests z3-solver
    
    - name: Test import
      run: |
        PYTHONPATH=src python -c "from hermes.llm_requirement.self_audit import SelfAuditor; print('Import successful')"