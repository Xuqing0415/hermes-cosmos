# GitHub Actions CI/CD for Hermes

name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short -x --ignore=tests/test_e2e.py --ignore=tests/test_ci.py --ignore=tests/test_scheduler.py