# GitHub Actions CI/CD for Hermes

name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install minimal dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio jinja2 structlog requests z3-solver
    
    - name: Run minimal tests
      run: |
        PYTHONPATH=src python -m pytest tests/test_self_rebirth.py::TestSelfAuditor::test_init -v --tb=short