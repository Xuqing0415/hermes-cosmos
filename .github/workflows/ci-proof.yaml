# GitHub Actions workflow for incremental proof verification

name: CI Proof Verification

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests
        run: |
          PYTHONPATH=src python -m pytest tests/test_self_rebirth.py::TestSelfAuditor tests/test_self_rebirth.py::TestTrendAnalyzer tests/test_self_rebirth.py::TestArchitectureDesigner -v --tb=short