# GitHub Actions workflow for incremental proof verification
# 增量证明验证：仅在对 main/develop 的 PR 和 push 时触发

name: CI Proof Verification

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  proof:
    name: Proof Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-proof-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-proof-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run proof tests
        run: |
          PYTHONPATH=src python -m pytest \
            tests/test_self_rebirth.py::TestSelfAuditor \
            tests/test_self_rebirth.py::TestTrendAnalyzer \
            tests/test_self_rebirth.py::TestArchitectureDesigner \
            -v --tb=short