apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-scheduler
  namespace: hermes
  labels:
    app: hermes-scheduler
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hermes-scheduler
  template:
    metadata:
      labels:
        app: hermes-scheduler
    spec:
      serviceAccountName: hermes-scheduler
      containers:
      - name: scheduler
        image: hermes-scheduler:latest
        ports:
        - containerPort: 8001
        env:
        - name: REDIS_HOST
          value: "redis.hermes.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: PROMETHEUS_ENABLED
          value: "true"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-scheduler
  namespace: hermes
spec:
  selector:
    app: hermes-scheduler
  ports:
  - port: 8001
    targetPort: 8001
  clusterIP: None
