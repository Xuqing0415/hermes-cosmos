apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hermesjobs.training.hermes.io
spec:
  group: training.hermes.io
  names:
    kind: HermesJob
    listKind: HermesJobList
    plural: hermesjobs
    singular: hermesjob
    shortNames:
      - hj
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                modelName:
                  type: string
                numGPUs:
                  type: integer
                  minimum: 1
                gpuType:
                  type: string
                  default: "A100"
                checkpointInterval:
                  type: integer
                  default: 100
                priority:
                  type: string
                  enum: ["low", "normal", "high", "critical"]
                  default: "normal"
                maxDuration:
                  type: string
                  default: "72h"
                dataResidency:
                  type: string
                restartPolicy:
                  type: string
                  enum: ["Always", "OnFailure", "Never"]
                  default: "OnFailure"
              required:
                - modelName
                - numGPUs
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Scheduled", "Running", "Completed", "Failed", "Recovering"]
                currentGPUs:
                  type: integer
                checkpointCount:
                  type: integer
                startTime:
                  type: string
                lastCheckpointTime:
                  type: string
                recoveryCount:
                  type: integer
                message:
                  type: string
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hermescheckpoints.training.hermes.io
spec:
  group: training.hermes.io
  names:
    kind: HermesCheckpoint
    listKind: HermesCheckpointList
    plural: hermescheckpoints
    singular: hermescheckpoint
    shortNames:
      - hc
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                jobName:
                  type: string
                step:
                  type: integer
                storageType:
                  type: string
                  enum: ["redis", "minio", "local"]
                  default: "redis"
                region:
                  type: string
              required:
                - jobName
                - step
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Creating", "Ready", "Failed"]
                size:
                  type: string
                createdAt:
                  type: string
                replicas:
                  type: integer
