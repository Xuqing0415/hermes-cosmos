apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermesjob-manager-role
rules:
- apiGroups:
  - training.hermes.io
  resources:
  - hermesjobs
  - hermesjobs/status
  - hermesjobs/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - training.hermes.io
  resources:
  - hermescheckpoints
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  - services
  - persistentvolumeclaims
  - events
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermesjob-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermesjob-manager-role
subjects:
- kind: ServiceAccount
  name: hermes-operator
  namespace: default
