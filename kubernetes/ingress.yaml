# Hermes Federated Learning - Ingress Configuration

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-ingress
  namespace: hermes
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - hermes.example.com
    secretName: hermes-tls
  rules:
  - host: hermes.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hermes-server
            port:
              number: 8000
      - path: /dashboard
        pathType: Prefix
        backend:
          service:
            name: hermes-dashboard
            port:
              number: 8501
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: hermes-server
            port:
              number: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-dashboard
  namespace: hermes
spec:
  type: ClusterIP
  ports:
  - port: 8501
    targetPort: 8501
    protocol: TCP
    name: http
  selector:
    app: hermes
    component: dashboard
