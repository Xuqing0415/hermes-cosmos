# Hermes Federated Learning - Kubernetes Deployment
# Deployment for the central server

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-server
  labels:
    app: hermes
    component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes
      component: server
  template:
    metadata:
      labels:
        app: hermes
        component: server
    spec:
      containers:
      - name: server
        image: hermes-federated:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: SERVER_PORT
          value: "8000"
        - name: LOG_LEVEL
          value: "INFO"
        - name: WORKERS
          value: "4"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-server
  labels:
    app: hermes
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: hermes
    component: server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8000
      workers: 4
    
    federated:
      num_rounds: 100
      clients_per_round: 10
      local_epochs: 1
    
    defense:
      type: "krum"
      tolerance: 0.3
    
    monitoring:
      prometheus_port: 9090
      log_level: "INFO"
